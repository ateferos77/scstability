name: publish

# Releases go to PyPI through Trusted Publishing, so no API token exists
# anywhere -- not in the repository, not in GitHub secrets, not on a laptop.
# PyPI mints a short-lived credential for this exact workflow instead.
#
# ONE-TIME SETUP, before the first tag. On https://pypi.org/manage/account/publishing/
# add a pending publisher with exactly these values:
#
#   PyPI project name : scstability
#   Owner             : ateferos77
#   Repository name   : scstability
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# Then every release is:
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with the version in the code publishes a release
      # under the wrong number, and PyPI will not let it be replaced. Checking
      # here costs nothing; discovering it afterwards costs a version.
      - name: Tag, pyproject and __version__ must all agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          dunder=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/scstability/__init__.py').read_text()).group(1))")
          echo "tag=$tag  pyproject=$pyproject  __version__=$dunder"
          test "$tag" = "$pyproject" || { echo "::error::tag $tag != pyproject $pyproject"; exit 1; }
          test "$tag" = "$dunder" || { echo "::error::tag $tag != __version__ $dunder"; exit 1; }

      - run: pip install build twine
      - run: python -m build

      # Repeated from the test workflow because this is the artefact that
      # actually gets published, not merely one built from the same source.
      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The only permission Trusted Publishing needs, and the only one granted.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
